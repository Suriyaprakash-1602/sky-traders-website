<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9F1D0" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <!-- Green Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D7A4D" />
      <stop offset="100%" stop-color="#0B3D2E" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    <!-- Coconut Shell Gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C" />
      <stop offset="100%" stop-color="#4E2E28" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM CIRCLE -->
  <g transform="translate(10, 5)">
    <!-- Outer Golden Double Rings -->
    <circle cx="65" cy="65" r="62" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="65" cy="65" r="57" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="120 4" />
    <circle cx="65" cy="65" r="54" fill="#FDFBF7" stroke="#0B3D2E" stroke-width="0.5" opacity="0.3" />

    <!-- Sky background elements (birds) -->
    <path d="M 45 42 Q 50 38 55 42 Q 60 38 65 42" fill="none" stroke="#0B3D2E" stroke-width="1.2" opacity="0.6" />
    <path d="M 32 50 Q 36 47 40 50 Q 44 47 48 50" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.5" />

    <!-- Palm Tree Trunk -->
    <path d="M 68 110 C 65 85 75 60 82 45 C 83 44 80 44 79 46 C 71 62 61 85 64 110 Z" fill="url(#trunkGrad)" />
    <!-- Trunk Ring Details -->
    <path d="M 65 98 Q 67 96 70 98 M 66 88 Q 68 86 72 88 M 68 78 Q 71 76 75 78" fill="none" stroke="#A1887F" stroke-width="1" />

    <!-- Palm Tree Leaves/Fronds -->
    <path d="M 80 46 Q 95 30 112 35 Q 98 42 82 48 Z" fill="url(#leafGrad)" />
    <path d="M 80 46 Q 105 40 115 55 Q 98 55 81 49 Z" fill="#1B5E20" />
    <path d="M 80 46 Q 70 25 50 24 Q 65 35 78 46 Z" fill="url(#leafGrad)" />
    <path d="M 80 46 Q 85 20 98 18 Q 92 32 81 45 Z" fill="#2E7D32" />
    <path d="M 80 46 Q 55 35 40 45 Q 60 50 78 48 Z" fill="#0B3D2E" />

    <!-- Ground fronds (Left bottom) -->
    <path d="M 22 95 Q 35 75 48 70 Q 42 85 30 102 Z" fill="url(#leafGrad)" />
    <path d="M 30 102 Q 45 80 60 78 Q 50 92 40 108 Z" fill="#2E7D32" />
    <path d="M 18 105 Q 30 90 45 88 Q 35 100 25 110 Z" fill="#0B3D2E" />

    <!-- Half Cut Coconut (Foreground Right) -->
    <g transform="translate(58, 72)">
      <!-- Outer Shell -->
      <ellipse cx="26" cy="24" rx="22" ry="20" fill="url(#shellGrad)" stroke="#3E2723" stroke-width="1.5" />
      <!-- Coconut Fiber Texture -->
      <path d="M 10 18 Q 8 28 14 36 M 38 14 Q 44 24 38 34" fill="none" stroke="#6D4C41" stroke-width="1" opacity="0.7" />
      <!-- White Coconut Meat Rim -->
      <ellipse cx="26" cy="24" rx="17" ry="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
      <!-- Inner Hollow/Water Shadow -->
      <ellipse cx="26" cy="24" rx="11" ry="9" fill="#F5F5F5" />
      <ellipse cx="26" cy="24" rx="9" ry="7" fill="#E8F5E9" opacity="0.5" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(155, 30)">
    <!-- "SKY" Text - Crisp White / Dark Outline style -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', 'Helvetica', sans-serif" font-size="52" font-weight="900" letter-spacing="12" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2.5" paint-order="stroke fill">
      SKY
    </text>

    <!-- "TRADERS" Text - Gold Premium Tracking -->
    <text x="4" y="85" font-family="'Outfit', 'Montserrat', sans-serif" font-size="22" font-weight="700" letter-spacing="14" fill="url(#goldText)" filter="url(#goldGlow)">
      TRADERS
    </text>

    <!-- Tagline below -->
    <text x="6" y="102" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="4" fill="#0B3D2E" opacity="0.8">
      PREMIUM COCONUT EXPORTERS • INDIA
    </text>
  </g>
</svg>
