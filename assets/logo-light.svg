<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9F1D0" />
    </linearGradient>
    <linearGradient id="goldTextL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF8DC" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="leafGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="trunkGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
    <linearGradient id="shellGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1887F" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>
    <filter id="goldGlowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM CIRCLE -->
  <g transform="translate(10, 5)">
    <circle cx="65" cy="65" r="62" fill="#073B2D" stroke="url(#goldGradL)" stroke-width="3" />
    <circle cx="65" cy="65" r="57" fill="none" stroke="url(#goldGradL)" stroke-width="1.5" stroke-dasharray="120 4" />
    <circle cx="65" cy="65" r="54" fill="#0B3D2E" stroke="#D4AF37" stroke-width="0.5" opacity="0.5" />

    <!-- Sky birds -->
    <path d="M 45 42 Q 50 38 55 42 Q 60 38 65 42" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.8" />
    <path d="M 32 50 Q 36 47 40 50 Q 44 47 48 50" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.7" />

    <!-- Palm Tree Trunk -->
    <path d="M 68 110 C 65 85 75 60 82 45 C 83 44 80 44 79 46 C 71 62 61 85 64 110 Z" fill="url(#trunkGradL)" />
    <path d="M 65 98 Q 67 96 70 98 M 66 88 Q 68 86 72 88 M 68 78 Q 71 76 75 78" fill="none" stroke="#BCAAA4" stroke-width="1" />

    <!-- Palm Fronds -->
    <path d="M 80 46 Q 95 30 112 35 Q 98 42 82 48 Z" fill="url(#leafGradL)" />
    <path d="M 80 46 Q 105 40 115 55 Q 98 55 81 49 Z" fill="#66BB6A" />
    <path d="M 80 46 Q 70 25 50 24 Q 65 35 78 46 Z" fill="url(#leafGradL)" />
    <path d="M 80 46 Q 85 20 98 18 Q 92 32 81 45 Z" fill="#81C784" />
    <path d="M 80 46 Q 55 35 40 45 Q 60 50 78 48 Z" fill="#2E7D32" />

    <!-- Ground fronds -->
    <path d="M 22 95 Q 35 75 48 70 Q 42 85 30 102 Z" fill="url(#leafGradL)" />
    <path d="M 30 102 Q 45 80 60 78 Q 50 92 40 108 Z" fill="#4CAF50" />
    <path d="M 18 105 Q 30 90 45 88 Q 35 100 25 110 Z" fill="#1B5E20" />

    <!-- Half Cut Coconut -->
    <g transform="translate(58, 72)">
      <ellipse cx="26" cy="24" rx="22" ry="20" fill="url(#shellGradL)" stroke="#3E2723" stroke-width="1.5" />
      <path d="M 10 18 Q 8 28 14 36 M 38 14 Q 44 24 38 34" fill="none" stroke="#D7CCC8" stroke-width="1" opacity="0.7" />
      <ellipse cx="26" cy="24" rx="17" ry="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
      <ellipse cx="26" cy="24" rx="11" ry="9" fill="#F5F5F5" />
      <ellipse cx="26" cy="24" rx="9" ry="7" fill="#E8F5E9" opacity="0.6" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(155, 30)">
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="12" fill="#FFFFFF" stroke="url(#goldGradL)" stroke-width="1.5">
      SKY
    </text>
    <text x="4" y="85" font-family="'Outfit', 'Montserrat', sans-serif" font-size="22" font-weight="700" letter-spacing="14" fill="url(#goldTextL)" filter="url(#goldGlowL)">
      TRADERS
    </text>
    <text x="6" y="102" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="4" fill="#F8F5EE" opacity="0.9">
      PREMIUM COCONUT EXPORTERS • INDIA
    </text>
  </g>
</svg>
